[package]
name = "vidsync"
version = "1.0.0"
edition = "2021"
description = "VIDSYNC - a video player that follows Audacity 4.0's timecode"
license = "MIT"

[dependencies]
macroquad = "0.4.16"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "2.21"
zbus = "5.19"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
